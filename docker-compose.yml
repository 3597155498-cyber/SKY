services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sky_take_out}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化按文件名字典序执行
      - ./docs/sql/backup/baseline.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro
      - ./docs/sql/V1_user_auth.sql:/docker-entrypoint-initdb.d/02-v1-user-auth.sql:ro
      - ./docs/sql/V2_stock.sql:/docker-entrypoint-initdb.d/03-v2-stock.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sky-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sky-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sky}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-sky123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: sky-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-sky}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-sky123}
      WECHAT_MOCK: "true"
      # compose 未内置 Nacos/AI 服务：关闭注册发现，AI 接口走本地降级，单体链路仍可用
      NACOS_DISCOVERY_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
