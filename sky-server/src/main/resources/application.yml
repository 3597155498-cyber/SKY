server:
  port: 8080

spring:
  application:
    name: sky-server
  profiles:
    active: dev
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
      # 连接池：默认 max-active=8，高并发下会先卡在取连接，按实例规格调到 20
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 3000

  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sky}
    password: ${RABBITMQ_PASSWORD:sky123}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3000
    # 发布确认 + 路由失败返回，用于记录消息是否真的到达 broker
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

feign:
  circuitbreaker:
    # feign fallback 需要 circuit breaker 运行时；这里用 Resilience4j，不引入 Sentinel
    enabled: true
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 8000

resilience4j:
  timelimiter:
    configs:
      default:
        # 默认 1s 会把模型调用（约 1~4s）误判为超时，必须大于 Feign 读超时
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 管理端令牌配置
    admin-secret-key: itcast
    admin-ttl: 7200000
    admin-token-name: token
    # 用户端令牌配置（与管理端使用不同密钥，双端令牌互不通用）
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication
  ai:
    # 主服务只保留本地降级所需参数；模型/限流/人格配置已随服务迁到 sky-ai-server
    max-items: 5
    circuit-ttl-seconds: 15
  mq:
    enabled: ${SKY_MQ_ENABLED:true}
    comment:
      # 批量消费上限；1s 没攒满也会触发
      batch-size: 20