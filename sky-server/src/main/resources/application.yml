server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
      # 连接池：默认 max-active=8，高并发下会先卡在取连接，按实例规格调到 20
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 3000

  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 管理端令牌配置
    admin-secret-key: itcast
    admin-ttl: 7200000
    admin-token-name: token
    # 用户端令牌配置（与管理端使用不同密钥，双端令牌互不通用）
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication
  ai:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    mock: ${AI_MOCK:false}
    timeout-ms: 4000
    rate-limit-per-hour: 10
    cache-ttl-minutes: 10
    max-items: 5
    # 是否额外调用一次模型生成推荐理由（关闭则用模板理由，少一次调用、延迟减半）
    reason-enabled: false
    persona:
      mascot-name: 小天
      style: 热情、简洁、偶尔卖萌
      greeting: 想吃点什么？直接告诉我想吃辣还是清淡、几个人、预算多少～
      not-understood: 我没太听清，先给你几个本店热销的，你也可以直接说口味或预算～
      degraded: 网络有点慢，我先按热销给你推荐～