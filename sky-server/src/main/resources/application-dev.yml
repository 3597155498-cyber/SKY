spring:
  cloud:
    nacos:
      discovery:
        # 本机双服务联调：显式注册 127.0.0.1，避免多网卡时 Feign 拿到不可达的虚拟网卡地址
        ip: 127.0.0.1

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 123456
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIOSS_BUCKET_NAME:}
  redis:
    host: localhost
    port: 6379
    password:
    database: 1
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    mock: ${WECHAT_MOCK:true}

