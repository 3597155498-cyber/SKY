server:
  port: 8081

spring:
  application:
    name: sky-ai-server
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sky_take_out}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:1}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        ai:
          mapper: debug
          service: info
          controller: info

sky:
  ai:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    mock: ${AI_MOCK:false}
    timeout-ms: 4000
    rate-limit-per-hour: 10
    cache-ttl-minutes: 10
    max-items: 5
    # 是否额外调用一次模型生成推荐理由（关闭则用模板理由，少一次调用、延迟减半）
    reason-enabled: false
    persona:
      mascot-name: 小天
      style: 热情、简洁、偶尔卖萌
      greeting: 想吃点什么？直接告诉我想吃辣还是清淡、几个人、预算多少～
      not-understood: 我没太听清，先给你几个本店热销的，你也可以直接说口味或预算～
      degraded: 网络有点慢，我先按热销给你推荐～
